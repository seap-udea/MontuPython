name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version label for artifacts (defaults to montu_gui/version.py)
        required: false
        type: string
  push:
    tags:
      - "desktop-v*"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop-build.txt
            setup.py

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "value=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(grep '^version' montu_gui/version.py | head -1 | sed "s/.*['\"]\\(.*\\)['\"].*/\\1/")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build macOS distributable
        run: bash bin/build-desktop.sh --clean

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MontuPython-Desktop-${{ steps.ver.outputs.value }}-macos
          path: |
            dist/desktop/*-macos.zip
            dist/desktop/*-macos.dmg
          if-no-files-found: error
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop-build.txt
            setup.py

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "value=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(grep '^version' montu_gui/version.py | head -1 | sed "s/.*['\"]\\(.*\\)['\"].*/\\1/")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Windows distributable
        shell: pwsh
        run: ./bin/build-desktop.ps1 -Clean

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MontuPython-Desktop-${{ steps.ver.outputs.value }}-windows
          path: dist/desktop/*-windows.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MontuPython Desktop ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**/*
          draft: false
          prerelease: false
