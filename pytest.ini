[pytest]
addopts = -ra
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = montu/tests montu_gui/tests
markers =
    docstrings: tests derived from examples shown in docstrings
    notebooks: tests derived from workflows documented in example notebooks
    structure: tests validating the shared structure of example notebooks
    desktop: tests for MontuPython Desktop pure-logic modules
    desktop_examples: tests executing Let's Python! desktop example scripts
norecursedirs = .git .venv build dist docs/_build tmp montmp contrib
